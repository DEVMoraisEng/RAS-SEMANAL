<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAS · Morais Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#2A285F; --petroleo:#1B5173; --verde:#81C9C0; --menta:#CCE8E6;
  --ink:#20263B; --muted:#68727E; --line:#DCE6E5; --bg:#F4F9F8; --card:#FFFFFF;

  --afazer:#E3E8EA; --afazer-t:#4A5560;
  --andamento:#FFD666; --andamento-t:#6B5200;
  --concluido:#81C9C0; --concluido-t:#0E3B37;
  --pendente:#EE9C90; --pendente-t:#6B1410;
  --alta:#F8D3CE; --alta-t:#9B1C1C; --media:#FDECC8; --media-t:#8A5A00; --baixa:#DCEFE0; --baixa-t:#2F6B3B;
  --continua:#E3D4F5; --continua-t:#4B2E83;

  --dep-diretoria:#2A285F; --dep-comercial:#1B5173; --dep-financeiro:#2C6E86;
  --dep-compras:#1E8F82; --dep-projetos:#4B4870;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,.disp{font-family:Sora,Inter,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}

/* ===== header ===== */
header{background:linear-gradient(135deg,var(--navy) 0%,var(--petroleo) 100%);position:relative}
header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--verde) 0%,var(--menta) 100%)}
.hbar{display:flex;align-items:center;gap:16px;padding:18px 0 14px}
.hbar img{height:52px;display:block}
.logo-chip{background:#fff;border-radius:10px;padding:6px 12px;display:inline-flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.htitle{font-weight:700;font-size:19px;letter-spacing:.1px;color:#fff}
.hsub{color:rgba(255,255,255,.72);font-size:12px;margin-top:1px}
.hspace{flex:1}
.weekpick{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:10px}
.weekpick label{font-size:11px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.weekpick select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-weight:600}
.tabs{display:flex;gap:4px;border-top:1px solid rgba(255,255,255,.16)}
.tab{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.62);font:inherit;font-weight:700;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:#fff}
.tab.active{color:#fff;border-bottom-color:var(--verde)}

main{position:relative}
main.wrap{padding:40px 22px 60px}
.view{display:none} .view.active{display:block}

/* ===== hero / skyline signature ===== */
.hero-wrap{position:relative;overflow:hidden;border-radius:16px;margin-bottom:4px}
.skyline{position:absolute;right:0;bottom:0;left:0;height:70px;opacity:.35;pointer-events:none}

/* ===== KPI cards ===== */
.kpis{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:12px;position:relative}
.kpi{border-radius:14px;padding:14px 16px;color:#fff;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .lab{font-size:11px;letter-spacing:.7px;text-transform:uppercase;opacity:.95;font-weight:700}
.kpi .val{font-family:Sora;font-size:34px;font-weight:700;line-height:1}
.kpi.hero{background:linear-gradient(135deg,var(--petroleo),var(--navy))}
.kpi.k1{background:#8A929B}.kpi.k2{background:var(--andamento);color:var(--andamento-t)}
.kpi.k3{background:var(--pendente);color:var(--pendente-t)}.kpi.k4{background:var(--verde);color:var(--concluido-t)}
.kpi.k5{background:var(--navy)}
.kpi.small .val{font-size:26px}

.sec-title{font-size:16px;font-weight:700;margin:26px 0 12px;color:var(--navy);display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== relatório table ===== */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;font-size:11px;letter-spacing:.5px;text-transform:uppercase;text-align:center;padding:11px 10px;font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px;border-top:1px solid var(--line);text-align:center;font-size:13px}
.tbl tr:nth-child(even) td{background:#F7FBFA}
.tbl tr.total td{background:var(--petroleo);color:#fff;font-weight:700}
.bar{height:8px;border-radius:6px;background:#EBEFF1;overflow:hidden;display:inline-block;width:70px;vertical-align:middle;margin-right:8px}
.bar>span{display:block;height:100%;background:var(--verde)}

/* ===== week quick switch ===== */
.weekswitch{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.wbtn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px}
.wbtn:hover{background:var(--menta)}
.wbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wlabel{color:var(--muted);font-size:12px;margin-left:4px}

/* ===== department boards (full width) ===== */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.board .bhead{padding:13px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.board .bhead .bt{font-weight:700;font-size:15px}
.board .bhead .bmeta{font-size:11.5px;opacity:.92;margin-top:1px}
.addbtn{appearance:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;font-size:12.5px}
.addbtn:hover{background:rgba(255,255,255,.26)}
.dtbl-wrap{overflow-x:auto}
.dtbl{width:100%;border-collapse:collapse}
.dtbl th{background:#F7FBFA;color:var(--navy);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.dtbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.dtbl tr:last-child td{border-bottom:0}
.dtbl tr:hover td{background:#FAFCFB}
.dtbl .c-atv{min-width:280px}
.dtbl .c-obra-nome{min-width:240px;white-space:normal}
.dtbl tr.prioritaria td{background:#FFF6E0}
.dtbl tr.prioritaria td:first-child{border-left:3px solid #E0A100}
.dtbl .c-atv.done{text-decoration:line-through;color:var(--muted)}
.dtbl .c-resp{white-space:nowrap;color:var(--ink);font-weight:600;font-size:12.5px}
.dtbl .c-obs input{width:100%;border:1px solid transparent;background:transparent;font:inherit;padding:5px 6px;border-radius:6px}
.dtbl .c-obs input:hover{border-color:var(--line)}
.dtbl .c-obs input:focus{border-color:var(--verde);background:#fff;outline:none}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.st-select,.pr-select,.resp-select{font:inherit;font-size:11.5px;font-weight:700;border:0;border-radius:20px;padding:4px 8px;cursor:pointer}
.resp-fixed{font-size:12.5px;color:var(--ink);font-weight:600}
.wknav{display:flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap}
.wknav button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;width:22px;height:22px;line-height:1;padding:0;cursor:pointer;font-size:11px}
.wknav button:hover{background:var(--menta,#CCE8E6)}
.wknav span{font-size:12px;font-weight:700;min-width:38px;text-align:center}
.delbtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;width:26px;height:26px;line-height:1;padding:0;cursor:pointer;font-size:13px}
.delbtn:hover{background:#FCE8E8;color:#B3261E;border-color:#F1B8B8}
.c-del{text-align:center;width:34px}
.empty-row td{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}

/* ===== obras ===== */
.filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between}
.filters .left{display:flex;gap:10px;align-items:center}
.filters select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.star{color:#E0A100}
.city-board{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.city-board .chead{padding:12px 16px;background:var(--petroleo);color:#fff;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.city-board .chead .cmeta{font-size:11.5px;opacity:.9;font-weight:500}
.setor-row td{background:var(--menta)!important;color:var(--navy);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:7px 12px!important}

/* ===== buttons ===== */
.btn-add-top{appearance:none;border:0;background:var(--petroleo);color:#fff;font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px}
.btn-add-top:hover{background:var(--navy)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;background:rgba(20,25,30,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.sheet h3{margin:0 0 4px;color:var(--navy)}
.sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font:inherit}
.field textarea{resize:vertical;min-height:52px}
.radiorow{display:flex;gap:10px}
.radiorow label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:9px;cursor:pointer;flex:1}
.radiorow input{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn{appearance:none;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#EEF1F3;color:var(--ink)}
.btn.primary{background:var(--petroleo);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.chk input{width:auto}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--muted);font-size:12px;margin-top:20px}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.hbar{flex-wrap:wrap}.htitle{font-size:16px}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<!-- modal criar atividade -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3>Nova atividade</h3>
    <p class="sub" id="modalSub"></p>
    <div class="field">
      <label>Atividade</label>
      <textarea id="f_atv" placeholder="Descreva a atividade"></textarea>
    </div>
    <div class="field" id="f_resp_wrap"></div>
    <div class="row2">
      <div class="field">
        <label>Prioridade</label>
        <select id="f_prio"><option>Alta</option><option selected>Média</option><option>Baixa</option></select>
      </div>
      <div class="field">
        <label>Status inicial</label>
        <select id="f_status"><option selected>A Fazer</option><option>Em Andamento</option><option>Pendente</option></select>
      </div>
    </div>
    <div class="field">
      <label>Observações (opcional)</label>
      <textarea id="f_obs" placeholder="Contexto adicional"></textarea>
    </div>
    <div class="field">
      <label class="chk"><input type="checkbox" id="f_copart" onchange="toggleCopart()"> Coparticipação — criar também para outra pessoa/setor</label>
    </div>
    <div class="row2" id="f_copart_wrap" style="display:none">
      <div class="field">
        <label>Setor coparticipante</label>
        <select id="f_copart_setor" onchange="fillCopartResp()"></select>
      </div>
      <div class="field">
        <label>Responsável coparticipante</label>
        <select id="f_copart_resp"></select>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="saveAtividade()">Criar atividade</button>
    </div>
  </div>
</div>

<!-- modal criar obra -->
<div class="modal" id="modalObra">
  <div class="sheet">
    <h3>Nova obra</h3>
    <p class="sub">Cidade aceita valores novos — é só digitar. Em Setor, escolha um existente ou "➕ Criar novo setor".</p>
    <div class="field">
      <label>Identificação (ex.: TB 21 QD 02 LT 03)</label>
      <input id="o_nome" placeholder="Quadra / Lote / referência">
    </div>
    <div class="row2">
      <div class="field">
        <label>Cidade</label>
        <input id="o_cidade" list="dl_cidades" placeholder="Ex.: Goiânia">
        <datalist id="dl_cidades"></datalist>
      </div>
      <div class="field">
        <label>Setor / Empreendimento</label>
        <select id="o_setor_sel" onchange="onSetorSel()"></select>
        <input id="o_setor_novo" placeholder="Nome do novo setor" style="display:none;margin-top:6px">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Mês</label>
        <input id="o_mes" list="dl_meses" placeholder="Ex.: Agosto/2026">
        <datalist id="dl_meses"></datalist>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="o_status"></select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Entrega prevista (opcional)</label>
        <input id="o_entrega" type="date">
      </div>
      <div class="field" style="display:flex;align-items:flex-end">
        <label class="chk"><input type="checkbox" id="o_prio" checked> Obra prioritária</label>
      </div>
    </div>
    <div class="field">
      <label>Observações (opcional)</label>
      <textarea id="o_obs"></textarea>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModalObra()">Cancelar</button>
      <button class="btn primary" onclick="saveObra()">Criar obra</button>
    </div>
  </div>
</div>

let ATIV=[], OBRAS=[], addSetor=null;

function fmtBR(d){ if(!d) return "—"; const p=d.slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
// Segunda-feira (YYYY-MM-DD) da semana que contém a data d.
function isoMonday(d){
  const dow = d.getDay(); // 0=domingo..6=sábado
  const diff = dow===0 ? -6 : 1-dow; // volta até a segunda-feira
  const seg = new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
  const p = n => String(n).padStart(2,"0");
  return `${seg.getFullYear()}-${p(seg.getMonth()+1)}-${p(seg.getDate())}`;
}
// A semana atual é SEMPRE a segunda da semana de HOJE — nunca a maior data dos dados.
function segundaAtual(){ return isoMonday(new Date()); }
function segundaAnterior(){ const d=new Date(); d.setDate(d.getDate()-7); return isoMonday(d); }
function isSeedData(){ return ATIV.length && String(ATIV[0].id).startsWith("seed"); }

async function boot(){
  try{
    const [a,o] = await Promise.all([
      fetch("dist/data_atividades.json").then(r=>{if(!r.ok)throw 0;return r.json()}),
      fetch("dist/data_obras.json").then(r=>{if(!r.ok)throw 0;return r.json()})
    ]);
    ATIV = a.atividades||[]; OBRAS = o.obras||[];
  }catch(e){ ATIV = SEED_ATIV.slice(); OBRAS = SEED_OBRAS.slice(); }
  const SEG = segundaAtual();
  const ANT = segundaAnterior();
  // Junta as semanas dos dados com a semana atual e a anterior (mesmo que ainda
  // não tenham atividades), para o seletor e os botões sempre funcionarem.
  const weeks = [...new Set([...ATIV.map(x=>x.semana).filter(Boolean), SEG, ANT])].sort().reverse();
  const sel = document.getElementById("week");
  sel.innerHTML = weeks.map(w=>`<option value="${w}" ${w===SEG?"selected":""}>${fmtBR(w)}${w===SEG?" (atual)":""}</option>`).join("") || `<option>—</option>`;
  render();
}

function currentWeek(){ return document.getElementById("week").value; }
function weekList(){ return [...document.getElementById("week").options].map(o=>o.value); }

// Reconstrói o seletor de semanas do zero a partir do estado atual de ATIV
// (mesma regra do boot(): semana atual + anterior sempre presentes, mais
// qualquer semana que tenha pelo menos uma atividade). Chamado sempre que
// uma atividade muda de semana, é criada ou é excluída — assim uma semana
// que ficou vazia (e não é a atual/anterior) desaparece sozinha do seletor,
// e uma semana nova (ex.: empurrada pra frente) aparece na hora.
function recomputarSeletorSemanas(){
  const SEG = segundaAtual(), ANT = segundaAnterior();
  const selecionadaAntes = currentWeek();
  const weeks = [...new Set([...ATIV.map(x=>x.semana).filter(Boolean), SEG, ANT])].sort().reverse();
  const sel = document.getElementById("week");
  sel.innerHTML = weeks.map(w=>`<option value="${w}" ${w===selecionadaAntes?"selected":""}>${fmtBR(w)}${w===SEG?" (atual)":""}</option>`).join("") || `<option>—</option>`;
  // Se a semana que estava sendo vista sumiu da lista (ficou vazia e não é
  // atual/anterior), volta a visualização pra semana atual.
  if(![...sel.options].some(o=>o.value===selecionadaAntes)) sel.value = SEG;
}

function weekSwitchHTML(){
  const cur = currentWeek();
  const atualW = segundaAtual(), anteriorW = segundaAnterior();
  let html = `<div class="weekswitch">`;
  if(atualW) html += `<button class="wbtn ${cur===atualW?'on':''}" onclick="setWeek('${atualW}')">Semana atual · ${fmtBR(atualW)}</button>`;
  if(anteriorW) html += `<button class="wbtn ${cur===anteriorW?'on':''}" onclick="setWeek('${anteriorW}')">◀ Semana anterior · ${fmtBR(anteriorW)}</button>`;
  html += `<span class="wlabel">Toda segunda, o que não foi concluído passa sozinho para a semana atual.</span></div>`;
  return html;
}

function renderObras(){

  const cur = window._obraMes || (meses[meses.length-1]||"");
  const filtered = OBRAS.filter(o=>!cur || o.mes===cur);

  const filter = `<div class="filters">
    <div class="left">
      <label style="font-size:12px;color:var(--muted)">Mês:</label>
      <select onchange="window._obraMes=this.value;renderObras()">
        ${meses.map(m=>`<option ${m===cur?"selected":""}>${m}</option>`).join("")}

  function linhaObra(o){
    const [sb,st] = OBRA_STCOL[o.status]||["#eee","#333"];
    // Garante que o valor atual da obra sempre exista no seletor, mesmo que não
    // esteja na lista base (evita o status "sumir" da própria linha).
    const opcoesSt = obraStatusOpcoes(o.status);
    const stSel = opcoesSt.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("");
    const prSel = ["Sim","Não"].map(v=>`<option ${v===(o.prioritaria||"Não")?"selected":""}>${v}</option>`).join("");
    return `<tr class="${o.prioritaria==='Sim'?'prioritaria':''}">
      <td class="c-obra-nome">${escapeHtml(o.nome)}</td>
      <td><select class="st-select" style="background:${sb};color:${st}" onchange="changeFieldObra('${o.id}','status',this.value)">${stSel}</select></td>
      <td><input type="date" value="${escapeAttr((o.entrega||'').slice(0,10))}" onchange="changeFieldObra('${o.id}','entrega',this.value)"></td>
      <td style="text-align:center"><select class="pr-select" onchange="changeFieldObra('${o.id}','prioritaria',this.value)" title="Obra prioritária">${prSel}</select></td>
      <td class="c-obs"><input value="${escapeAttr(o.obs||'')}" placeholder="—" onblur="changeFieldObra('${o.id}','obs',this.value)"></td>
      <td class="c-del"><button class="delbtn" title="Excluir obra" onclick="excluirObra('${o.id}')">🗑</button></td>
    </tr>`;
  }

  let html = filter;
  if(!cidades.length){
    html += `<div class="city-board"><table class="dtbl"><tbody><tr class="empty-row"><td colspan="6">Nenhuma obra neste mês.</td></tr></tbody></table></div>`;
  }
  cidades.forEach(cidade=>{
    const rowsCidade = filtered.filter(o=>o.cidade===cidade);
    const setores = [...new Set(rowsCidade.map(o=>o.setor).filter(Boolean))].sort();
    let body="";
    setores.forEach(setor=>{
      body += `<tr class="setor-row"><td colspan="6">${escapeHtml(setor)}</td></tr>`;
      rowsCidade.filter(o=>o.setor===setor).forEach(o=>{ body += linhaObra(o); });
    });
    const semSetor = rowsCidade.filter(o=>!o.setor);
    semSetor.forEach(o=>{ body += linhaObra(o); });
    html += `<div class="city-board">
      <div class="chead"><span>${cidade}</span><span class="cmeta">${rowsCidade.length} obra(s)</span></div>
      <div class="dtbl-wrap"><table class="dtbl">
        <thead><tr><th>Obra</th><th>Status</th><th>Entrega prevista</th><th>Prior.</th><th>Obs</th><th></th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>`;
  });
  html += `<div class="foot">Selecione "Sim" na coluna Prior. para marcar a obra como prioritária.</div>`;
  document.getElementById("obras").innerHTML = html;
}

function changeFieldObra(id, field, value){
  const o = OBRAS.find(x=>x.id===id); if(!o) return;
  o[field] = value;
  if(WRITE_ENDPOINT){ post({action:"update_obra", id, field, value}); }
}

function excluirObra(id){
  const o = OBRAS.find(x=>x.id===id); if(!o) return;
  if(!confirm(`Excluir a obra "${o.nome}"?\n\nEla vai para a lixeira do Notion (dá pra recuperar por lá se for engano).`)) return;
  OBRAS = OBRAS.filter(x=>x.id!==id); render();
  if(String(id).startsWith("local-")){
    toast("Removida da tela. Ainda não tinha sincronizado com o Notion.");
    return;
  }
  if(WRITE_ENDPOINT){ post({action:"delete_obra", id}); toast("Obra excluída."); }
  else { toast("Excluída (modo teste — só na tela)."); }
}

function renderFoot(){
  const src = isSeedData() ? "dados de exemplo" : "dados do Notion";
  document.getElementById("foot").textContent =
    `Fonte: ${src}. ` + (WRITE_ENDPOINT? "Botão de criar conectado ao Notion." : "Modo teste: criações/edições aparecem só na tela até conectar o endpoint de escrita.");
}

function changeField(id, field, value){
  const a = ATIV.find(x=>x.id===id); if(!a) return;
  a[field] = value;
  if(field==="semana") recomputarSeletorSemanas();
  render();
  if(WRITE_ENDPOINT){ post({action:"update", id, field, value}); }
}

function excluirAtividade(id){
  const a = ATIV.find(x=>x.id===id); if(!a) return;
  if(!confirm(`Excluir a atividade "${a.nome}"?\n\nEla vai para a lixeira do Notion (dá pra recuperar por lá se for engano).`)) return;
  ATIV = ATIV.filter(x=>x.id!==id);
  recomputarSeletorSemanas(); render();
  if(String(id).startsWith("local-")){
    // Ainda não sincronizou com o Notion (criada nesta sessão, antes do
    // próximo fetch_ras.py) — não existe página real pra excluir lá.
    toast("Removida da tela. Ainda não tinha sincronizado com o Notion.");
    return;
  }
  if(WRITE_ENDPOINT){ post({action:"delete", id}); toast("Atividade excluída."); }
  else { toast("Excluída (modo teste — só na tela)."); }
}

// Soma/subtrai N semanas e SEMPRE devolve uma segunda-feira (movimento
// travado de segunda em segunda, para frente ou para trás).
function addWeeks(iso, n){
  const p = (iso || segundaAtual()).slice(0,10).split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + 7*n);
  return isoMonday(d);
}
function moverSemana(id, n){
  const a = ATIV.find(x=>x.id===id); if(!a) return;
  changeField(id, "semana", addWeeks(a.semana, n));
}

function openModal(setor){
  addSetor=setor;
  document.getElementById("modalSub").textContent = `Departamento ${setor} · semana atual · ${fmtBR(segundaAtual())}`;
  document.getElementById("f_atv").value="";
  document.getElementById("f_obs").value="";
  document.getElementById("f_status").value="A Fazer";
  document.getElementById("f_copart").checked=false;
  document.getElementById("f_copart_wrap").style.display="none";
  const locked = RESP_LOCK[setor]||[];
  const wrap = document.getElementById("f_resp_wrap");
  if(locked.length>1){
    wrap.innerHTML = `<label>Responsável</label><div class="radiorow">` +
      locked.map((n,i)=>`<label><input type="radio" name="f_resp_r" value="${n}" ${i===0?"checked":""}> ${n}</label>`).join("") + `</div>`;
  } else {
    wrap.innerHTML = `<label>Responsável</label><input value="${locked[0]||''}" disabled style="background:#F4F7F8;color:var(--muted)">`;
  }
  document.getElementById("modal").classList.add("open");
  document.getElementById("f_atv").focus();
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

function getRespFromModal(){
  const locked = RESP_LOCK[addSetor]||[];
  if(locked.length>1){
    const r = document.querySelector('input[name="f_resp_r"]:checked');
    return r? r.value : locked[0];
  }
  return locked[0]||"";
}

function toggleCopart(){
  const on = document.getElementById("f_copart").checked;
  document.getElementById("f_copart_wrap").style.display = on ? "" : "none";
  if(on) fillCopartSetores();
}
function fillCopartSetores(){
  const sel = document.getElementById("f_copart_setor");
  sel.innerHTML = DEPARTAMENTOS.map(s=>`<option>${s}</option>`).join("");
  sel.value = DEPARTAMENTOS.find(s=>s!==addSetor) || DEPARTAMENTOS[0]; // sugere outro setor
  fillCopartResp();
}
function fillCopartResp(){
  const setor = document.getElementById("f_copart_setor").value;
  const resp  = document.getElementById("f_copart_resp");
  const locked = RESP_LOCK[setor]||[];
  resp.innerHTML = locked.length ? locked.map(n=>`<option>${n}</option>`).join("") : `<option value=""></option>`;
}

function criarEntrada(nome, setor, resp, prioridade, status, semana, obs){
  const dados = {action:"create", atividade:nome, setor, responsavel:resp, prioridade, status, semana, obs};
  ATIV.push({id:"local-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
             nome, setor, responsavel:resp, prioridade, status, semana, obs});
  if(WRITE_ENDPOINT){ post(dados); }
}

function saveAtividade(){
  const nome = document.getElementById("f_atv").value.trim();
  if(!nome){ toast("Escreva a atividade."); return; }
  const prioridade = document.getElementById("f_prio").value;
  const status     = document.getElementById("f_status").value;
  const semana     = segundaAtual();
  const obs        = document.getElementById("f_obs").value.trim();
  const respPrim   = getRespFromModal();

  criarEntrada(nome, addSetor, respPrim, prioridade, status, semana, obs);
  let dupla = false;

  if(document.getElementById("f_copart").checked){
    const cSetor = document.getElementById("f_copart_setor").value;
    const cResp  = document.getElementById("f_copart_resp").value;
    if(cSetor && cResp && !(cSetor===addSetor && cResp===respPrim)){
      criarEntrada(nome, cSetor, cResp, prioridade, status, semana, obs);
      dupla = true;
    }
  }

  closeModal(); render();
  const base = dupla ? "Atividade criada para os dois setores" : "Atividade criada";
  toast(WRITE_ENDPOINT ? base+" no Notion." : base+" (modo teste — só na tela).");
}

function openModalObra(){
  const cidades=[...new Set(OBRAS.map(o=>o.cidade).filter(Boolean))].sort();
  const setores=[...new Set(OBRAS.map(o=>o.setor).filter(Boolean))].sort();
  const meses=[...new Set(OBRAS.map(o=>o.mes).filter(Boolean))].sort();
  document.getElementById("dl_cidades").innerHTML = cidades.map(c=>`<option value="${escapeAttr(c)}">`).join("");
  document.getElementById("dl_meses").innerHTML = meses.map(c=>`<option value="${escapeAttr(c)}">`).join("");
  // Setor: existentes + opção de criar novo
  document.getElementById("o_setor_sel").innerHTML =
    setores.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join("") +
    `<option value="__novo__">➕ Criar novo setor…</option>`;
  document.getElementById("o_setor_novo").value=""; document.getElementById("o_setor_novo").style.display="none";
  // Status: base + status reais dos dados
  document.getElementById("o_status").innerHTML =
    obraStatusOpcoes().map(s=>`<option ${s==="Em Andamento"?"selected":""}>${s}</option>`).join("");
  ["o_nome","o_cidade","o_entrega","o_obs"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("o_mes").value = window._obraMes || (meses[meses.length-1]||"");
  document.getElementById("o_prio").checked=true;
  document.getElementById("modalObra").classList.add("open");
  document.getElementById("o_nome").focus();
}
function onSetorSel(){
  const novo = document.getElementById("o_setor_sel").value==="__novo__";
  const inp = document.getElementById("o_setor_novo");
  inp.style.display = novo ? "" : "none";
  if(novo) inp.focus();
}
function getSetorObra(){
  const sel = document.getElementById("o_setor_sel").value;
  return sel==="__novo__" ? document.getElementById("o_setor_novo").value.trim() : sel;
}
function closeModalObra(){ document.getElementById("modalObra").classList.remove("open"); }

function saveObra(){
  const nome = document.getElementById("o_nome").value.trim();
  const cidade = document.getElementById("o_cidade").value.trim();
  if(!nome || !cidade){ toast("Preencha ao menos Identificação e Cidade."); return; }
  const dados = {
    action:"create_obra", nome, cidade,
    setor:getSetorObra(),
    mes:document.getElementById("o_mes").value.trim(),
    status:document.getElementById("o_status").value,
    entrega:document.getElementById("o_entrega").value,
    prioritaria: document.getElementById("o_prio").checked ? "Sim":"Não",
    obs:document.getElementById("o_obs").value.trim()
  };
  OBRAS.push({id:"local-"+Date.now(), ...dados});
  closeModalObra(); render();
  if(WRITE_ENDPOINT){ post(dados); toast("Obra criada no Notion."); }
  else { toast("Criada (modo teste — só na tela)."); }
}

function post(dados){
  // GET com parâmetros na URL — mesmo padrão validado no OBRAS-GERAL.
  // POST com corpo JSON em modo no-cors não é confiável para Apps Script.
  const qs = Object.entries(dados)
    .map(([k,v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v ?? "")}`)
    .join("&");
  fetch(`${WRITE_ENDPOINT}?${qs}`, {method:"GET", mode:"no-cors"})
    .catch(()=>toast("Falha ao enviar ao endpoint."));
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,"&#39;"); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.getElementById("modalObra").addEventListener("click",e=>{ if(e.target.id==="modalObra") closeModalObra(); });

boot();
</script>
