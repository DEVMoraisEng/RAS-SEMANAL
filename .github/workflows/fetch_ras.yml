name: RAS - atualizar dados (leitura)

on:
  schedule:
    - cron: "0 */1 * * *"   # rede de segurança: a cada 1h (pega edições feitas direto no Notion, caso não haja webhook)
  workflow_dispatch: {}
  repository_dispatch:
    types: [ras_update]     # disparado pelo Apps Script (throttle de 15 min) quando o site altera o Notion

# Se dois eventos chegarem quase juntos, roda um de cada vez (não cancela o que já começou).
concurrency:
  group: ras-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para o git push no final do job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 fetch_ras.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RAS_ATIVIDADES_DB_ID: ${{ secrets.RAS_ATIVIDADES_DB_ID }}
          RAS_OBRAS_DB_ID: ${{ secrets.RAS_OBRAS_DB_ID }}
      - run: |
          git config user.name "ras-bot"
          git config user.email "ras-bot@morais"
          git add dist/*.json
          git commit -m "RAS: atualizar dados" || echo "sem mudanças"
          git pull --rebase -X theirs origin main
          git push
