<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso · Morais Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema claro fixo. Sem isto, o Android/iOS em modo escuro inverte controles
   nativos (inputs, selects, datas, scrollbar) e o site fica com campos pretos
   sobre o layout claro. "light only" recusa a inversão em vez de só sugerir. */
:root{color-scheme:light only}
html{min-height:100%}
body{min-height:100vh}

:root{
  --navy:#2A285F; --petroleo:#1B5173; --verde:#81C9C0; --menta:#CCE8E6;
  --ink:#20263B; --muted:#68727E; --line:#DCE6E5; --card:#FFFFFF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--navy) 0%,var(--petroleo) 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
  position:relative;overflow:hidden;
}
body::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;
  background:linear-gradient(90deg,var(--verde),var(--menta))}
.card{
  width:100%;max-width:380px;background:var(--card);border-radius:18px;
  padding:34px 30px 30px;box-shadow:0 24px 60px rgba(0,0,0,.30);position:relative;z-index:2
}
.logo{display:flex;justify-content:center;margin-bottom:14px}
.logo img{height:78px}
.logo .fallback{font-family:Sora;font-weight:800;font-size:26px;color:var(--navy)}
h1{font-family:Sora;font-size:19px;font-weight:700;text-align:center;margin:2px 0 2px}
.sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--petroleo);margin:0 0 6px}
.field{margin-bottom:15px}
input[type=text],input[type=password]{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;
  font:inherit;font-size:14px;transition:border-color .15s,box-shadow .15s;background:#FBFDFC
}
input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px rgba(129,201,192,.25);background:#fff}
.row{display:flex;align-items:center;gap:8px;margin:2px 0 20px;font-size:13px;color:var(--muted)}
.row input{width:16px;height:16px;accent-color:var(--petroleo)}
button{
  width:100%;border:0;border-radius:10px;padding:13px;cursor:pointer;
  font:inherit;font-weight:700;font-size:14.5px;color:#fff;
  background:linear-gradient(135deg,var(--petroleo),var(--navy));transition:filter .15s,transform .05s
}
button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
.erro{display:none;background:#FDECEA;color:#9B1C1C;border:1px solid #F5C6C0;
  border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px;font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
.load{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="img/logo.png" alt="Morais Engenharia" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="fallback" style="display:none">MORAIS</span>
    </div>
    <h1>Sistemas Internos</h1>
    <div class="sub">Engenharia e Construção</div>

    <div class="erro" id="erro"></div>

    <div class="field">
      <label for="login">Login</label>
      <input type="text" id="login" autocomplete="username" autocapitalize="none"
             spellcheck="false" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <div class="row">
      <input type="checkbox" id="manter" checked>
      <label for="manter" style="text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;margin:0;font-size:13px">
        Manter conectado neste computador
      </label>
    </div>
    <button id="btn" onclick="entrar()">Entrar</button>

    <div class="foot">Acesso restrito · Morais Engenharia</div>
  </div>

<script>
/* ================== CONFIG ==================
   Cole aqui a URL /exec do Apps Script (a mesma vai nos outros HTMLs).
   Ex.: https://script.google.com/macros/s/AKfy.../exec
   Obs.: se você usa vários e-mails Google, confira que a URL NÃO tem "/u/2/"
   no meio — use a /exec limpa. */
const API = "https://script.google.com/macros/s/AKfycbwvMnVHZd7y5k-GP8_Dg9zkWyD2fqqH8UI4gaXsQ0iJnm9QNSsyyUhODFMyMW6BfAk/exec";
const DESTINO = "index.html";   // pra onde vai depois de logar (portal)
/* =========================================== */

const KEY = "morais_sessao";

function sessaoSalva(){
  try { return JSON.parse(localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || "null"); }
  catch(e){ return null; }
}

async function api(payload, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs||25000); // evita ficar "Entrando..." travado pra sempre
  try{
    const r = await fetch(API, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, // evita preflight de CORS
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    return await r.json();
  } finally { clearTimeout(timer); }
}

function mostrarErro(msg){
  const e = document.getElementById("erro");
  e.textContent = msg; e.style.display = "block";
}

const MENSAGENS = {
  LOGIN_NAO_ENCONTRADO: "Login não encontrado.",
  SENHA_INCORRETA:      "Senha incorreta.",
  INFORME_LOGIN:        "Digite o login.",
  BLOQUEADO:            "Muitas tentativas. Aguarde alguns minutos e tente de novo.",
  NAO_AUTORIZADO:       "Sessão expirada. Entre novamente."
};

async function entrar(){
  const login = document.getElementById("login").value.trim();
  const senha = document.getElementById("senha").value;
  const manter = document.getElementById("manter").checked;
  const btn = document.getElementById("btn");
  document.getElementById("erro").style.display = "none";

  if(!login || !senha){ mostrarErro("Preencha login e senha."); return; }
  if(API.indexOf("COLE_AQUI") === 0){ mostrarErro("Falta configurar a URL do Apps Script (API)."); return; }

  btn.disabled = true; btn.innerHTML = '<span class="load"></span>Entrando...';
  try{
    const res = await api({ action:"login", login, senha });
    if(!res.ok){
      let msg = MENSAGENS[res.erro] || ("Erro: " + res.erro);
      if(res.erro==="SENHA_INCORRETA" && typeof res.restantes==="number") msg += " ("+res.restantes+" tentativa(s) restante(s))";
      mostrarErro(msg); return;
    }

    const dados = JSON.stringify({ token: res.token, ...res.sessao });
    sessionStorage.removeItem(KEY); localStorage.removeItem(KEY);
    (manter ? localStorage : sessionStorage).setItem(KEY, dados);
    location.href = DESTINO;
  }catch(err){
    mostrarErro("Não consegui falar com o servidor. Confira a URL do Apps Script e a internet.");
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
}

/* Auto-login OTIMISTA: se já há sessão salva, entra na hora e o index.html
   confere o token em segundo plano (se estiver inválido, ele devolve pra cá).
   Antes esta tela esperava a resposta do "me" do Apps Script antes de deixar
   entrar — em cold start dava vários segundos de tela branca a cada acesso.
   Não afrouxa nada: o token nunca foi validado no navegador, sempre no
   Apps Script, que continua conferindo em toda leitura e escrita real. */
(function(){
  const s = sessaoSalva();
  if(s && s.token && API.indexOf("COLE_AQUI") !== 0){ location.href = DESTINO; return; }
  document.getElementById("login").focus();
})();
</script>
</body>
</html>
